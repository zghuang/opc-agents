[project]
name = "app-delivery"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
delivery = "delivery.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.15.0,<1.0",
    "mypy>=2.1.0,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["delivery"]