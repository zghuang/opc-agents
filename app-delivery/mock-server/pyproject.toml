[project]
name = "{project-name}-mocks"
version = "0.1.0"
description = "External API mock server for {PROJECT_NAME}"
requires-python = ">=3.14,<3.15"

dependencies = [
    "fastapi>=0.136.3,<1.0",
    "uvicorn[standard]>=0.48.0,<1.0",
    "pydantic>=2.13.4,<3.0",
    "httpx>=0.28.1,<1.0",          # for conftest.py http client
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "pytest-httpx>=0.32",   # for httpx mocking in unit tests
    "requests>=2.31",       # for conftest.py startup check
    "faker>=26.0",          # for generating fake data in fixtures
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
