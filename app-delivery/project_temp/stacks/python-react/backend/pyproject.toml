[project]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiosqlite>=0.21.0,<1.0",
    "fastapi>=0.136.3,<1.0",
    "uvicorn[standard]>=0.48.0,<1.0",
    "sqlalchemy>=2.0.50,<3.0",
    "greenlet>=3.3.0,<4.0",
    "asyncpg>=0.31.0,<1.0",
    "pydantic>=2.13.4,<3.0",
    "pydantic-settings>=2.14.1,<3.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=5.0,<6.0",
    "alembic>=1.18.4,<2.0",
    "redis>=8.0.0,<9.0",
    "httpx>=0.28.1,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "pytest-cov>=6",
    "ruff>=0.15.15,<1.0",
    "mypy>=2.1.0,<3.0",
    "types-passlib>=1.7.7.20250602",
    "types-python-jose>=3.5.0.20250531",
]

[tool.ruff]
target-version = "py314"
line-length = 100
[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "TCH", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src"]
addopts = ["-v"]
pythonpath = ["."]

[tool.coverage.run]
omit = ["*/tests/*", "*/migrations/*", "src/main.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]