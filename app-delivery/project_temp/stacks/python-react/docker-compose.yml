services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: opc_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "opc_user"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://opc_user:${DB_PASSWORD:-password}@postgres:5432/app_db
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:8080"
    depends_on:
      - backend

  mocks:
    build: ./mock-server
    ports:
      - "8888:8888"

volumes:
  postgres_data: