services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: opc_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "opc_user"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_HOST_PORT:-15080}:8080"

  mocks:
    build: ./mock-server
    ports:
      - "${MOCK_SERVER_HOST_PORT:-18888}:8888"

volumes:
  postgres_data: